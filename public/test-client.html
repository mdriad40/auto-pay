<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Website - Checkout Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .demo-wrapper {
      max-width: 600px;
      margin: 40px auto;
      background: #FFFFFF;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="bg-ambient"></div>

  <div class="demo-wrapper">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom: 24px;">
      <div class="bkash-logo-badge" style="background:#0F172A;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      </div>
      <div>
        <h2 style="font-size:1.2rem; font-weight:800;">External Merchant Store Simulation</h2>
        <p style="font-size:0.8rem; color:var(--text-muted);">Testing Payment via your Custom Gateway & Split API</p>
      </div>
    </div>

    <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:16px; border-radius:12px; margin-bottom:20px;">
      <div style="font-size:0.85rem; font-weight:700; margin-bottom:4px;">Product: Premium Cloud Plan (1 Month)</div>
      <div style="font-size:1.2rem; font-weight:800; color:var(--bkash-pink);">Total: ৳ 100.00 BDT</div>
    </div>

    <form id="merchantCheckoutForm" onsubmit="runMerchantCheckout(event)">
      <div class="form-group">
        <label class="form-label">Project Name</label>
        <input type="text" id="demoProjectName" class="form-input" placeholder="e.g. MyStoreApp" required>
      </div>

      <div class="form-group">
        <label class="form-label">Project API Key</label>
        <input type="text" id="demoApiKey" class="form-input" placeholder="bkap_..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Project License Key</label>
        <input type="text" id="demoLicenseKey" class="form-input" placeholder="bklc_..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Payment Amount (BDT)</label>
        <input type="number" id="demoAmount" class="form-input" value="10" min="1" step="0.5" required>
      </div>

      <button type="submit" id="btnPayWithBkash" class="btn btn-primary" style="width:100%; padding:14px; font-size:1rem;">
        Pay With bKash (Via Your Gateway)
      </button>
    </form>

    <div id="checkoutStatus" style="margin-top: 20px; font-size: 0.85rem;"></div>
  </div>

  <script>
    async function runMerchantCheckout(e) {
      e.preventDefault();
      const btn = document.getElementById("btnPayWithBkash");
      const statusDiv = document.getElementById("checkoutStatus");

      btn.disabled = true;
      btn.textContent = "Connecting to Gateway...";
      statusDiv.innerHTML = `<span style="color:#0284C7;">⏳ Verifying Project Credentials with Gateway...</span>`;

      const projectName = document.getElementById("demoProjectName").value.trim();
      const apiKey = document.getElementById("demoApiKey").value.trim();
      const licenseKey = document.getElementById("demoLicenseKey").value.trim();
      const amount = document.getElementById("demoAmount").value.trim();

      try {
        const res = await fetch("/api/gateway/create-payment", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Api-Key": apiKey,
            "License-Key": licenseKey,
            "Project-Name": projectName
          },
          body: JSON.stringify({
            amount: amount,
            payerReference: projectName,
            merchantInvoiceNumber: "INV-" + projectName.toUpperCase().slice(0, 4) + "-" + Date.now(),
            callbackURL: window.location.origin + "/callback.html"
          })
        });

        const data = await res.json();

        if (res.ok && data.bkashURL) {
          statusDiv.innerHTML = `<span style="color:#10B981;">✅ Verified! Redirecting to bKash Gateway...</span>`;
          window.location.href = data.bkashURL;
        } else {
          statusDiv.innerHTML = `<div style="background:#FEF2F2; color:#991B1B; padding:12px; border-radius:8px; border:1px solid #FECACA;">
            <strong>Gateway Rejected:</strong> ${data.statusMessage || "Authentication Error"}
          </div>`;
          btn.disabled = false;
          btn.textContent = "Pay With bKash (Via Your Gateway)";
        }
      } catch (err) {
        statusDiv.innerHTML = `<span style="color:#EF4444;">Error: ${err.message}</span>`;
        btn.disabled = false;
        btn.textContent = "Pay With bKash (Via Your Gateway)";
      }
    }
  </script>
</body>
</html>
