<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Website - 2-Step Checkout Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .demo-wrapper {
      max-width: 580px;
      margin: 40px auto;
      background: #FFFFFF;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="bg-ambient"></div>

  <div class="demo-wrapper">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom: 20px;">
      <div class="bkash-logo-badge" style="background:#0F172A;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      </div>
      <div>
        <h2 style="font-size:1.15rem; font-weight:800;">External Merchant Store Simulation</h2>
        <p style="font-size:0.8rem; color:var(--text-muted);">Testing Single License-Key & Gateway URL Checkout</p>
      </div>
    </div>

    <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:16px; border-radius:12px; margin-bottom:20px;">
      <div style="font-size:0.85rem; font-weight:700; margin-bottom:4px; color:#334155;">Test Product: Cloud Pro Subscription (1 Month)</div>
      <div style="font-size:1.25rem; font-weight:800; color:var(--bkash-pink);">Payable: ৳ 50.00 BDT</div>
    </div>

    <form id="merchantCheckoutForm" onsubmit="runMerchantCheckout(event)">
      <div class="form-group">
        <label class="form-label">Gateway Base URL</label>
        <input type="text" id="demoGatewayUrl" class="form-input" placeholder="e.g. http://localhost:3000" required>
        <p class="form-hint">The domain where your bKash Gateway is hosted.</p>
      </div>

      <div class="form-group">
        <label class="form-label">Project License Key (Single Key)</label>
        <input type="text" id="demoLicenseKey" class="form-input" placeholder="bklc_..." required>
        <p class="form-hint">From your Admin Dashboard (Project Name & Domain are auto-resolved).</p>
      </div>

      <div class="form-group">
        <label class="form-label">Amount (BDT)</label>
        <input type="number" id="demoAmount" class="form-input" value="50" min="1" step="0.5" required>
      </div>

      <button type="submit" id="btnPayWithBkash" class="btn btn-primary" style="width:100%; padding:14px; font-size:1rem;">
        Pay With bKash (Single Key Test)
      </button>
    </form>

    <div id="checkoutStatus" style="margin-top: 20px; font-size: 0.85rem;"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("demoGatewayUrl").value = window.location.origin;
    });

    async function runMerchantCheckout(e) {
      e.preventDefault();
      const btn = document.getElementById("btnPayWithBkash");
      const statusDiv = document.getElementById("checkoutStatus");

      btn.disabled = true;
      btn.textContent = "Connecting to Gateway...";
      statusDiv.innerHTML = `<span style="color:#0284C7;">⏳ Verifying License Key & Authorized Domain with Gateway...</span>`;

      const gatewayUrl = document.getElementById("demoGatewayUrl").value.trim().replace(/\/$/, "");
      const licenseKey = document.getElementById("demoLicenseKey").value.trim();
      const amount = document.getElementById("demoAmount").value.trim();

      try {
        const res = await fetch(`${gatewayUrl}/api/gateway/create-payment`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "License-Key": licenseKey
          },
          body: JSON.stringify({
            amount: amount,
            customerPhone: "017XXXXXXXX",
            merchantInvoiceNumber: "INV-" + Date.now(),
            callbackURL: window.location.origin + "/callback.html"
          })
        });

        const data = await res.json();

        if (res.ok && data.bkashURL) {
          statusDiv.innerHTML = `<span style="color:#10B981;">✅ Verified! Project: <strong>${data.project || 'Active'}</strong>. Redirecting to bKash Gateway...</span>`;
          window.location.href = data.bkashURL;
        } else {
          statusDiv.innerHTML = `<div style="background:#FEF2F2; color:#991B1B; padding:12px; border-radius:8px; border:1px solid #FECACA;">
            <strong>Gateway Rejected:</strong> ${data.statusMessage || "Authentication Error"}
          </div>`;
          btn.disabled = false;
          btn.textContent = "Pay With bKash (Single Key Test)";
        }
      } catch (err) {
        statusDiv.innerHTML = `<div style="background:#FEF2F2; color:#991B1B; padding:12px; border-radius:8px; border:1px solid #FECACA;">
          <strong>Error:</strong> ${err.message}. Ensure Gateway URL is correct and server is running.
        </div>`;
        btn.disabled = false;
        btn.textContent = "Pay With bKash (Single Key Test)";
      }
    }
  </script>
</body>
</html>
